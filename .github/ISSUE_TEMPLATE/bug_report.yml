name: Bug report
description: Report a reproducible problem in the native KMC CLI
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. KMC 2 is currently beta software.
        Please remove secrets and private repository content from all output.
  - type: input
    id: version
    attributes:
      label: KMC version
      description: Output of `kmc --version`
      placeholder: v2.0.0-beta.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux amd64
        - Linux arm64
        - macOS Intel
        - macOS Apple Silicon
        - Windows amd64
        - Windows arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe set of commands or files that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant `kmc doctor` output after removing sensitive paths or data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing issue.
          required: true
        - label: I removed secrets and private repository data.
          required: true
