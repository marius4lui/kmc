name: Feature request
description: Propose a focused improvement to KMC
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        KMC 2 is currently beta. Explain the project workflow or problem first;
        implementation ideas are welcome after that.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a successful KMC workflow look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this today?
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: I considered existing `kmc.json` and KMC Scripts users.
          required: true
